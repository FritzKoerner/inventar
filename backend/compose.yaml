services:
  pocketbase:
    build: .
    # Run as the host user so files in the bind-mounted pb_data aren't owned by root.
    user: "${PB_UID:-1000}:${PB_GID:-1000}"
    ports:
      # 8090 on the host is taken by CVAT's traefik.
      - "127.0.0.1:8091:8090"
    volumes:
      - ./pb_data:/pb/pb_data
      - ./pb_migrations:/pb/pb_migrations
      - ./pb_hooks:/pb/pb_hooks
    restart: unless-stopped
